# Builds an unsigned .ipa on a macOS runner, because Xcode (and therefore any
# iOS build) cannot run on Windows or Linux.
#
# The artifact it produces is UNSIGNED: install it with a sideloading tool such
# as Sideloadly or AltStore, or re-sign it with your own Apple Developer
# certificate. For TestFlight distribution, see the notes at the bottom.
name: iOS build (.ipa)

on:
  workflow_dispatch: # run manually from the Actions tab
  push:
    tags:
      - 'v*'

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # The drift database code is generated; regenerate so the build does not
      # depend on the .g.dart files being committed.
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      # Flutter emits Runner.app; an .ipa is just a zip with it under Payload/.
      - name: Package .ipa
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qq -r Notably.ipa Payload
          ls -lh Notably.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Notably-ipa
          path: build/ios/iphoneos/Notably.ipa
          retention-days: 14

# ---------------------------------------------------------------------------
# To produce a SIGNED build for TestFlight you additionally need:
#   * an Apple Developer Program membership (paid),
#   * a distribution certificate (.p12) and provisioning profile stored as
#     encrypted repository secrets,
#   * an ExportOptions.plist, then `flutter build ipa --export-options-plist=...`
# ---------------------------------------------------------------------------
