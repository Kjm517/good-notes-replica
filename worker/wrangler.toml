# ---------------------------------------------------------------------------
# AI gateway
#
# The app used to call Google directly with a key bundled into the APK, which
# anyone could read with `unzip`. It now calls POST /ai/generate here, and the
# keys live only on the server.
#
# Defaults below are chosen for an app with no revenue: free tier first, image
# generation off, caching on, and a monthly ceiling low enough that a mistake
# is survivable. Raise them when users justify it.
# ---------------------------------------------------------------------------

# Usage counters and the budget check. Create once with:
#   wrangler d1 create notably-ai-usage
# then paste the returned database_id below.
# [[d1_databases]]
# binding = "AI_USAGE"
# database_name = "notably-ai-usage"
# database_id = "PASTE_ID_HERE"

# Cloudflare Workers AI — has a daily free allowance, so it goes first.
# Without its binding the "free tier first" chain below is a no-op: every
# request skips straight to Gemini, and when its credits run out the quiz
# feature is simply down. The binding itself is declared at the bottom of
# this file, because a `[table]` header here would capture every var under
# it and empty out [vars].

# Both paths go to Gemini, and the free tier is deliberately unused.
#
# Everything this app asks a model for is one long JSON array of quiz
# questions, and the free Workers AI models cannot deliver that. The 8B text
# model prefaces the array with "Here are 20 questions..." and wraps it in a
# markdown fence; the 11B vision model gets the shape right and then runs out
# of output tokens partway through, because its ceiling is far below Gemini's.
# Either way the array does not parse and the quiz fails.
#
# This was measured, not assumed — a "reply OK" smoke test passes on the free
# models and tells you nothing, which is how a broken quiz feature reached
# production earlier today. A quiz costs a fraction of a cent on Gemini.
#
# A document with no selectable text falls back to sending page images, so the
# vision path carries the same JSON requirement as the text path. Neither can
# be moved to the free tier without the parser being made to tolerate prose,
# fences and truncation first.
AI_TEXT_PROVIDER = "gemini"
AI_TEXT_MODEL = "gemini-3.5-flash-lite"
AI_VISION_PROVIDER = "gemini"
AI_VISION_MODEL = "gemini-3.5-flash-lite"
AI_FALLBACK_PROVIDER = "gemini"
AI_FALLBACK_MODEL = "gemini-3.5-flash-lite"

# Premium stays unset. Setting it is not enough on its own — AI_QUALITY must
# also be "quality" before it is ever reached.
# AI_PREMIUM_PROVIDER = "openrouter"
# AI_PREMIUM_MODEL = "google/gemini-3.5-flash"

AI_QUALITY = "economy"
AI_PROMPT_VERSION = "v1"
AI_CACHE_ENABLED = "true"
# "user" scopes cache entries per account. Safer, and gives up most of the
# saving, because a hash collision already means the input bytes were identical.
AI_CACHE_SCOPE = "global"
ENABLE_IMAGE_GENERATION = "false"

# Hard stops. MONTHLY_AI_BUDGET is checked before every paid call.
MONTHLY_AI_BUDGET = "10"
WARNING_BUDGET = "5"
MAX_AI_REQUESTS_PER_USER = "25"
MAX_VISION_REQUESTS_PER_USER = "10"
MAX_QUESTIONS_PER_GENERATION = "50"
MAX_DOCUMENT_PROCESSING_MB = "50"

# Keys are secrets, never vars:
#   wrangler secret put GEMINI_API_KEY
#   wrangler secret put OPENROUTER_API_KEY

# Declared last on purpose: TOML gives every key after a `[table]` header to
# that table, so putting this above the vars moved AI_TEXT_PROVIDER and the
# budget limits out of [vars] and left the gateway with no providers at all.
[ai]
binding = "AI"
